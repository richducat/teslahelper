<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tech Fighter II: Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #0b1e3b;
            --ui-color: #fff;
            --p1-color: #e74c3c;
            --cpu-color: #3498db;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--ui-color);
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }

        canvas { 
            display: block; 
            image-rendering: pixelated; 
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        /* Scanline Overlay */
        #game-wrapper::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        #match-timer {
            position: absolute; top: 10px; width: 100%; text-align: center;
            font-size: 24px; color: #fff; text-shadow: 2px 2px #000; z-index: 20;
        }

        /* Dynamic HUD Bar */
        .hud-bar {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            padding: 40px 20px 20px 20px; width: 100%; box-sizing: border-box;
            max-height: 300px; overflow: hidden;
        }

        .fighter-hud {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.6); padding: 5px; border-radius: 4px;
            border: 2px solid #555; min-width: 80px;
            box-shadow: 0 4px #000;
            transition: transform 0.1s;
        }
        .fighter-hud.p1 { border-color: var(--p1-color); }
        .fighter-hud.cpu { border-color: var(--cpu-color); }
        .fighter-hud.dead { opacity: 0.3; filter: grayscale(100%); }

        .name-tag { font-size: 8px; color: #fff; margin-bottom: 4px; font-weight: bold; white-space: nowrap; text-transform: uppercase; text-shadow: 1px 1px #000; }
        .percent-display { font-size: 16px; color: #fff; text-shadow: 2px 2px 0 #000; margin-bottom: 2px; }
        .stock-container { display: flex; gap: 3px; margin-bottom: 4px; }
        .stock-icon { width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 1px solid #000; }
        .weapon-mini { font-size: 6px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        /* Screens */
        #screens {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50; pointer-events: auto;
        }

        .screen-content {
            text-align: center; display: none; width: 100%; height: 100%;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .screen-content.active { display: flex; }

        h1 { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; margin-bottom: 20px; letter-spacing: -2px; }
        h2 { font-size: 20px; color: #3498db; margin-bottom: 30px; text-transform: uppercase; }
        .subtitle { color: #f1c40f; margin-bottom: 40px; font-size: 16px; letter-spacing: 4px; text-shadow: 2px 2px #000; }

        .btn-start {
            padding: 15px 30px; background: #e74c3c; color: #fff; border: none;
            font-family: inherit; font-size: 16px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 6px 0 #c0392b; margin: 10px; border-radius: 4px;
        }
        .btn-start:hover { transform: translateY(2px); box-shadow: 0 4px 0 #c0392b; }
        .btn-mode { background: #3498db; box-shadow: 0 6px 0 #2980b9; }
        .btn-mode:hover { box-shadow: 0 4px 0 #2980b9; }

        .control-group { margin: 15px 0; background: #222; padding: 15px; border: 2px solid #444; border-radius: 8px;}
        .control-label { font-size: 10px; color: #aaa; margin-bottom: 10px; display: block; }
        .cpu-counter { font-size: 24px; color: #f1c40f; margin: 0 15px; vertical-align: middle; }
        .btn-small { padding: 5px 15px; font-size: 20px; cursor: pointer; background: #444; color: #fff; border: 2px solid #666; vertical-align: middle; border-radius: 4px; }

        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .char-card-lg {
            width: 100px; height: 120px; background: #111; border: 4px solid #555;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s; position: relative;
        }
        .char-card-lg.selected { border-color: #f1c40f; background: #222; transform: scale(1.1); box-shadow: 0 0 15px #f1c40f; z-index: 10; }
        .char-name-lg { font-size: 8px; color: #aaa; margin-top: 10px; text-transform: uppercase; }
        .char-canvas { width: 80px; height: 80px; image-rendering: pixelated; background: #222; }

        .stage-list { display: flex; flex-direction: column; gap: 10px; width: 60%; }
        .stage-option { background: #222; border: 2px solid #444; padding: 15px; cursor: pointer; color: #888; font-size: 12px; text-align: left; }
        .stage-option.selected { background: #3498db; color: #fff; border-color: #fff; }

        #mobile-controls {
            display: none; position: absolute; bottom: 20px; left: 0;
            width: 100%; height: 160px; pointer-events: auto; z-index: 101;
            padding: 0 30px; box-sizing: border-box; justify-content: space-between;
        }
        .d-pad { width: 140px; height: 140px; position: relative; }
        .d-btn { position: absolute; width: 45px; height: 45px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }
        .d-up { top:0; left:47px; } .d-down { bottom:0; left:47px; } .d-left { top:47px; left:0; } .d-right { top:47px; right:0; }
        .action-btns { display: flex; gap: 25px; align-items: flex-end; padding-bottom: 25px; }
        .a-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(231, 76, 60, 0.4); border: 2px solid #c0392b; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .b-btn { background: rgba(46, 204, 113, 0.4); border-color: #27ae60; }

        #overlay-text {
            position: absolute; top: 45%; width: 100%; text-align: center;
            font-size: 80px; color: #f1c40f; text-shadow: 6px 6px 0 #000;
            transform: scale(0); transition: transform 0.2s; pointer-events: none; z-index: 30;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="match-info">00:00</div>
        <div class="hud-bar" id="hud" style="display: none;">
            <!-- Generated Dynamically -->
        </div>
        <div id="overlay-text">GO!</div>
    </div>

    <div id="screens">
        <!-- Title -->
        <div id="screen-title" class="screen-content active">
            <br>
            <h1>TECH FIGHTER II</h1>
            <div class="subtitle">ULTIMATE EDITION</div>
            <div style="height: 30px;"></div>
            <div>
                <button class="btn-start" onclick="game.setMode('VERSUS')">VERSUS</button>
                <button class="btn-start btn-mode" onclick="game.setMode('SURVIVAL')">SURVIVAL</button>
            </div>
            <div style="margin-top: 40px; font-size: 10px; color: #aaa; line-height: 1.8;">
                RULE: DIE AT 100% DAMAGE<br><br>
                CONTROLS:<br>
                <span style="color:#f1c40f">Z</span> = ATTACK/PICKUP | <span style="color:#f1c40f">X</span> = SPECIAL<br>
                <span style="color:#f1c40f">UP</span> = JUMP | <span style="color:#f1c40f">DOWN</span> = SHIELD/DROP
            </div>
        </div>

        <!-- Select -->
        <div id="screen-char-select" class="screen-content">
            <h2>SETUP MATCH</h2>
            
            <div class="control-group" id="cpu-config">
                <span class="control-label">TOTAL FIGHTERS</span>
                <button class="btn-small" onclick="game.adjustCpu(-1)">-</button>
                <span class="cpu-counter" id="cpu-count-display">4</span>
                <button class="btn-small" onclick="game.adjustCpu(1)">+</button>
            </div>

            <div class="char-grid" id="char-grid-lg"></div>
            <div id="p1-select-name" style="color: #f1c40f; height: 20px; font-size: 12px;">SELECT YOUR FIGHTER</div>
        </div>

        <!-- Stage -->
        <div id="screen-stage-select" class="screen-content">
            <h2>PICK ARENA</h2>
            <div class="stage-list" id="stage-list"></div>
        </div>
        
        <!-- Game Over -->
        <div id="screen-gameover" class="screen-content">
            <h1 id="winner-text" style="color: #f1c40f; font-size: 40px;">GAME SET</h1>
            <h2 id="survival-score" style="display:none; color: #fff;">KILLS: 0</h2>
            <button class="btn-start" onclick="game.resetToTitle()">MENU</button>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="d-pad">
            <div class="d-btn d-up" data-key="ArrowUp"></div>
            <div class="d-btn d-down" data-key="ArrowDown"></div>
            <div class="d-btn d-left" data-key="ArrowLeft"></div>
            <div class="d-btn d-right" data-key="ArrowRight"></div>
        </div>
        <div class="action-btns">
            <div class="a-btn" data-key="z">ATK</div>
            <div class="a-btn b-btn" data-key="x">SPL</div>
        </div>
    </div>
</div>

<script>
/* --- SOUND ENGINE --- */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    }
}

/* --- CONFIGURATION --- */
const ROSTER = [
    { id: 'elon', name: 'ELON', art: { skin: '#ffdbac', shirt: '#fff', suit: '#111', hair: '#3e2723' }, weight: 1.1 },
    { id: 'zuck', name: 'ZUCK', art: { skin: '#e6e6e6', shirt: '#95a5a6', suit: '#546e7a', hair: '#d35400' }, weight: 0.9 },
    { id: 'gates', name: 'GATES', art: { skin: '#ffdbac', shirt: '#8e44ad', suit: '#8e44ad', hair: '#95a5a6' }, weight: 1.0 },
    { id: 'bezos', name: 'BEZOS', art: { skin: '#ffdbac', shirt: '#212121', suit: '#212121', hair: '#ffdbac' }, weight: 1.05 },
    { id: 'doge', name: 'DOGE', art: { skin: '#f1c40f', shirt: '#f39c12', suit: '#e67e22', hair: '#fff' }, weight: 0.8 },
    { id: 'altman', name: 'ALTMAN', art: { skin: '#ffdbac', shirt: '#fff', suit: '#2c3e50', hair: '#2c3e50' }, weight: 1.0 },
];

const ITEMS = [
    { name: 'Beam Sword', color: '#3498db', type: 'melee', dmg: 14, w: 60, h: 6 },
    { name: 'Ray Gun', color: '#e74c3c', type: 'gun', dmg: 5, ammo: 10 },
    { name: 'Ban Hammer', color: '#333', type: 'heavy', dmg: 25, w: 20, h: 40 },
    { name: 'Flamethrower', color: '#f1c40f', type: 'gun', dmg: 2, ammo: 50 },
    { name: 'Drone', color: '#95a5a6', type: 'passive', dmg: 5 },
    { name: 'Box Cutter', color: '#e67e22', type: 'melee', dmg: 8, w: 30, h: 8 },
    { name: 'Mars Rock', color: '#c0392b', type: 'throw', dmg: 18 },
    { name: 'Bonk Bat', color: '#f1c40f', type: 'melee', dmg: 10, w: 40, h: 10 }
];

const STAGES = [
    { id: 'factory', name: 'GIGAFACTORY', colors: ['#0b1e3b', '#1c4e80'] },
    { id: 'mars', name: 'MARS COLONY', colors: ['#5e2015', '#b7410e'] },
    { id: 'meta', name: 'METAVERSE', colors: ['#000000', '#1a0b2e'] }
];

// FIXED INTERNAL RESOLUTION for Retro Pixel Art Look
const CONFIG = {
    FPS: 60, GRAVITY: 0.5,
    WIDTH: 960, HEIGHT: 540, // Fixed 16:9 internal resolution
    PLATFORM: { x: 100, y: 400, w: 760, h: 20 },
    BLAST_ZONES: { top: -600, bottom: 800, left: -500, right: 1500 }
};

/* --- CLASSES --- */
class Input {
    constructor() {
        this.keys = {};
        window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
        const btns = document.querySelectorAll('.d-btn, .a-btn');
        btns.forEach(b => {
            b.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[b.dataset.key] = true; });
            b.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[b.dataset.key] = false; });
        });
        if('ontouchstart' in window) document.getElementById('mobile-controls').style.display = 'flex';
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.size = Math.random() * 4 + 2;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 20;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.life--;
    }
    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

class Obstacle {
    constructor(x, y, w, h, type) {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.type = type; 
        this.vx = 0; this.vy = 0;
        this.active = true;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if(this.x < -100 || this.x > CONFIG.WIDTH + 100) this.active = false;
    }
    draw(ctx) {
        if(!this.active) return;
        if(this.type === 'crate') {
            ctx.fillStyle = '#8d6e63'; ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.strokeStyle = '#5d4037'; ctx.lineWidth=2; ctx.strokeRect(this.x, this.y, this.w, this.h);
            // Crate detail
            ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x+this.w, this.y+this.h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(this.x+this.w, this.y); ctx.lineTo(this.x, this.y+this.h); ctx.stroke();
        } else if (this.type === 'meteor') {
            ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(this.x+this.w/2, this.y+this.h/2, this.w/2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'orange'; ctx.beginPath(); ctx.arc(this.x+this.w/2, this.y+this.h/2, this.w/2-5, 0, Math.PI*2); ctx.fill();
        } else if (this.type === 'glitch') {
            ctx.fillStyle = `rgba(0, 255, 255, ${Math.random()})`;
            ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

class ItemEntity {
    constructor(type, x, y) {
        this.def = type; this.x = x; this.y = y; this.w = 30; this.h = 30;
        this.vx = 0; this.vy = 0; this.active = true; this.floatOffset = 0;
    }
    update() {
        this.vy += CONFIG.GRAVITY; this.y += this.vy;
        let plat = CONFIG.PLATFORM;
        if (this.y + this.h > plat.y && this.y < plat.y + 20 && this.x > plat.x && this.x < plat.x + plat.w) {
            this.y = plat.y - this.h; this.vy = -this.vy * 0.5; this.vx *= 0.9;
            if(Math.abs(this.vy) < 1) this.vy = 0;
        }
        this.x += this.vx;
        if(this.y > CONFIG.HEIGHT + 100) this.active = false;
        this.floatOffset = Math.sin(Date.now() / 200) * 3;
    }
    draw(ctx) {
        drawWeaponGraphic(ctx, this.def, this.x, this.y + this.floatOffset);
    }
}

class Fighter {
    constructor(data, x, id, isPlayer) {
        this.data = data; this.id = id; this.isPlayer = isPlayer;
        this.w = 50; this.h = 90;
        if (data.id === 'doge') { this.w = 60; this.h = 50; }
        
        this.x = x; this.y = 50; 
        this.percent = 0; this.stocks = 3; this.weight = data.weight;
        this.facingRight = (x < CONFIG.WIDTH/2);
        this.vx = 0; this.vy = 0; this.jumps = 0; this.maxJumps = 2; this.onGround = false;
        this.state = 'IDLE'; this.frame = 0; this.animTimer = 0; this.invincible = 0;
        this.item = null; this.ammo = 0; this.hasHit = false;
    }

    respawn(mode) {
        let plat = CONFIG.PLATFORM;
        this.x = plat.x + Math.random() * plat.w; this.y = 50; 
        this.vx = 0; this.vy = 0;
        this.percent = 0; this.state = 'IDLE'; this.invincible = 120; this.item = null;
        if(mode === 'SURVIVAL' && !this.isPlayer) {
            this.data = ROSTER[Math.floor(Math.random()*ROSTER.length)];
            this.stocks = 1;
        }
    }

    update(input, fighters, items, obstacles, game) {
        if (this.stocks <= 0) return;
        if (this.invincible > 0) this.invincible--;
        this.animTimer++;

        if (this.percent >= 100) { this.die(game); return; }

        if (this.state === 'STUN') {
            this.vy += CONFIG.GRAVITY; this.frame--;
            if(this.frame <= 0) this.state = 'IDLE';
            this.vx *= 0.95;
        } else if (this.state === 'ATTACK' || this.state === 'SPECIAL') {
            this.frame++; this.vy += CONFIG.GRAVITY; this.vx *= 0.9;
            this.checkHitbox(fighters, game);
            if(this.frame > 20) this.state = 'IDLE';
        } else if (this.state === 'SHIELD') {
            this.vx = 0; this.vy += CONFIG.GRAVITY;
            if (this.isPlayer && !input.keys['arrowdown']) this.state = 'IDLE';
            if (!this.isPlayer && Math.random() > 0.95) this.state = 'IDLE';
        } else {
            this.handleAI(fighters, items);
            this.handleMovement(input);
            this.handleAttacks(input, items);
        }

        this.x += this.vx; this.y += this.vy;
        this.handleCollisions(obstacles);

        if (this.x < CONFIG.BLAST_ZONES.left || this.x > CONFIG.BLAST_ZONES.right || this.y > CONFIG.BLAST_ZONES.bottom) {
            this.die(game);
        }
    }

    explode() { this.die(); }

    handleAI(fighters, items) {
        if (this.isPlayer) return;
        let target = null; let minDst = 9999;
        fighters.forEach(f => {
            if (f !== this && f.stocks > 0) {
                let d = Math.abs(f.x - this.x);
                if (d < minDst) { minDst = d; target = f; }
            }
        });

        this.aiInput = { left:false, right:false, up:false, down:false, z:false, x:false };
        if (!target) return;

        if (target.x > this.x + 50) this.aiInput.right = true;
        else if (target.x < this.x - 50) this.aiInput.left = true;
        
        if ((this.y > CONFIG.PLATFORM.y && !this.onGround) || (target.y < this.y - 100)) {
             if(Math.random()<0.1) this.aiInput.up = true;
        }
        if (minDst < 80 && Math.random() < 0.05) this.aiInput.z = true;
        if (!this.item) {
            let item = items.find(i => i.active && Math.abs(i.x - this.x) < 50);
            if (item) this.aiInput.z = true;
        }
    }

    handleMovement(input) {
        this.vy += CONFIG.GRAVITY;
        let keys = this.isPlayer ? input.keys : this.aiInput;
        let left = keys['arrowleft'] || keys.left;
        let right = keys['arrowright'] || keys.right;
        let up = keys['arrowup'] || keys.up;
        let down = keys['arrowdown'] || keys.down;

        if (left) { this.vx = this.onGround ? -5 : -3; this.facingRight = false; if (this.onGround) this.state = 'RUN'; }
        else if (right) { this.vx = this.onGround ? 5 : 3; this.facingRight = true; if (this.onGround) this.state = 'RUN'; }
        else { this.vx *= 0.8; if (this.onGround) this.state = 'IDLE'; }

        if (up && !this.keysWasUp && this.jumps < this.maxJumps) {
            this.vy = -12; this.jumps++; this.state = 'JUMP';
            playSound('jump');
        }
        this.keysWasUp = up;
        if (down && this.onGround) this.state = 'SHIELD';
    }

    handleAttacks(input, items) {
        let keys = this.isPlayer ? input.keys : this.aiInput;
        let atk = keys['z'] || keys.z;
        let spl = keys['x'] || keys.x;
        let down = keys['arrowdown'] || keys.down;

        if (atk && !this.keysWasAtk) {
            if (down && this.item) {
                let dropX = this.x + (this.facingRight ? 20 : -20);
                let dropItem = new ItemEntity(this.item, dropX, this.y + 20);
                dropItem.vx = this.facingRight ? 4 : -4; dropItem.vy = -6; 
                items.push(dropItem);
                this.item = null;
            } else if (!this.item) {
                let pickup = items.find(i => i.active && this.x < i.x+i.w+20 && this.x+this.w+20 > i.x && this.y < i.y+i.h+20 && this.y+this.h+20 > i.y);
                if (pickup) {
                    this.item = pickup.def; this.ammo = pickup.def.ammo || 99;
                    pickup.active = false;
                    playSound('jump'); 
                } else {
                    this.state = 'ATTACK'; this.frame = 0; this.hasHit = false;
                }
            } else {
                this.state = 'ATTACK'; this.frame = 0; this.hasHit = false;
                if(this.item.ammo) { this.ammo--; if(this.ammo<=0) this.item = null; }
            }
        }
        if (spl && !this.keysWasSpl) { this.state = 'SPECIAL'; this.frame = 0; this.vy = -15; this.hasHit = false; }
        this.keysWasAtk = atk; this.keysWasSpl = spl;
    }

    checkHitbox(fighters, game) {
        if (this.hasHit || this.frame < 5) return;
        let reach = this.item ? 80 : 50;
        let hitX = this.facingRight ? this.x + this.w : this.x - reach;
        
        fighters.forEach(enemy => {
            if (enemy === this || enemy.stocks <= 0) return;
            if (hitX < enemy.x + enemy.w && hitX + reach > enemy.x && this.y < enemy.y + enemy.h && this.y + 50 > enemy.y) {
                if (enemy.state !== 'SHIELD' && enemy.invincible <= 0) {
                    enemy.takeDamage(10, 10, this.facingRight ? -0.5 : -2.6, game);
                    this.hasHit = true;
                    game.shake = 10;
                    game.addParticles(enemy.x+enemy.w/2, enemy.y+enemy.h/2, '#fff');
                    playSound('hit');
                }
            }
        });
    }

    takeDamage(dmg, baseForce, angle, game) {
        this.percent += dmg; this.state = 'STUN'; this.frame = 15;
        game.hitStop = 5;
        let totalForce = (baseForce + (this.percent / 10)) / this.weight;
        this.vx = Math.cos(angle) * totalForce; this.vy = Math.sin(angle) * totalForce;
    }

    die(game) {
        this.stocks--;
        playSound('die');
        game.shake = 20;
        game.addParticles(this.x, this.y, this.isPlayer ? '#e74c3c' : '#3498db', 20);
        
        if (this.stocks > 0) {
            this.respawn(game.mode);
        } else {
            this.x = -9999;
            if (game.mode === 'SURVIVAL' && !this.isPlayer) {
                game.score++;
                game.fighters[0].percent = Math.max(0, game.fighters[0].percent - 20);
                setTimeout(() => {
                    this.stocks = 1;
                    this.respawn('SURVIVAL');
                }, 1000);
            }
        }
    }

    handleCollisions(obstacles) {
        let plat = CONFIG.PLATFORM;
        if (this.vy >= 0 && this.y + this.h >= plat.y && this.y + this.h <= plat.y + 25 && this.x + this.w > plat.x && this.x < plat.x + plat.w) {
            this.y = plat.y - this.h; this.vy = 0; this.onGround = true; this.jumps = 0;
        } else { this.onGround = false; }

        obstacles.forEach(o => {
            if (!o.active) return;
            if (o.type === 'meteor' || o.type === 'bot') {
                if(this.x < o.x+o.w && this.x+this.w > o.x && this.y < o.y+o.h && this.y+this.h > o.y) {
                    this.takeDamage(5, 5, -1.5, window.game);
                }
            }
            if (o.type === 'crate' || o.type === 'glitch') {
                if(this.x < o.x+o.w && this.x+this.w > o.x && this.y + this.h > o.y && this.y < o.y+o.h) {
                    if(this.x < o.x) this.x = o.x - this.w; else this.x = o.x + o.w;
                    this.vx = 0;
                }
            }
        });
    }

    draw(ctx) {
        if (this.stocks <= 0) return;
        if (this.invincible > 0 && Math.floor(Date.now() / 50) % 2 === 0) return;
        ctx.save();
        ctx.translate(Math.floor(this.x), Math.floor(this.y));
        if (this.state === 'SHIELD') {
            ctx.fillStyle = 'rgba(52, 152, 219, 0.5)'; ctx.beginPath(); ctx.arc(this.w/2, this.h/2, 45, 0, Math.PI*2); ctx.fill();
        }
        if (!this.facingRight) { ctx.translate(this.w, 0); ctx.scale(-1, 1); }
        
        const c = this.data.art;
        const bounce = (this.state === 'IDLE') ? Math.sin(this.animTimer * 0.15) * 2 : 0;

        if(this.data.id === 'doge') {
            ctx.fillStyle='#e67e22'; ctx.fillRect(10,25+bounce,45,25);
            ctx.fillStyle='#f1c40f'; ctx.fillRect(35,10+bounce,24,24);
            ctx.fillStyle='#fff'; ctx.fillRect(45,20+bounce,14,10);
            ctx.fillStyle='#000'; ctx.fillRect(56,20+bounce,4,4);
            ctx.fillStyle='#e67e22'; ctx.beginPath(); ctx.moveTo(38,10+bounce); ctx.lineTo(42,bounce); ctx.lineTo(46,10+bounce); ctx.fill();
            if(this.state==='ATTACK' && this.item) drawWeaponGraphic(ctx, this.item, 50, 30+bounce);
        } else {
            if (this.data.id === 'elon') {
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(5,30+bounce); ctx.lineTo(-15,this.h-10); ctx.lineTo(this.w,this.h-10); ctx.lineTo(this.w-5,30+bounce); ctx.fill();
            }
            ctx.fillStyle = (this.data.id==='zuck') ? '#2980b9' : (this.data.id==='gates'?'#e6be8a':c.suit);
            let legL=10, legR=28; if(this.state==='RUN'){ let r=Math.sin(this.animTimer*0.5)*10; legL+=r; legR-=r; }
            ctx.fillRect(legL, this.h-35, 12, 35); ctx.fillRect(legR, this.h-35, 12, 35);
            ctx.fillStyle = c.shirt;
            if(['elon','altman','bezos'].includes(this.data.id)) ctx.fillStyle='#111';
            ctx.fillRect(5, 30+bounce, this.w-10, 40);
            if(['elon','altman'].includes(this.data.id)){ ctx.fillStyle='#fff'; ctx.fillRect(18,35+bounce,14,20); ctx.fillStyle=(this.data.id==='altman'?'#2ecc71':'#000'); ctx.fillRect(23,35+bounce,4,20); }
            ctx.fillStyle = c.skin; ctx.fillRect(12, 5+bounce, 26, 26);
            ctx.fillStyle = '#000';
            if(this.data.id==='zuck'){ ctx.fillRect(16,14+bounce,4,4); ctx.fillRect(28,14+bounce,4,4); }
            else if(this.data.id==='bezos'){ ctx.fillStyle='#111'; ctx.fillRect(15,14+bounce,20,4); }
            else { ctx.fillRect(18,15+bounce,2,2); ctx.fillRect(30,15+bounce,2,2); }
            if(this.data.id!=='bezos'){ ctx.fillStyle=c.hair; ctx.fillRect(10,bounce,30,8); ctx.fillRect(10,bounce,4,20); }
            let armX=15, armY=35+bounce;
            if(this.state==='ATTACK') {
                ctx.fillStyle='#111'; ctx.fillRect(armX, armY, 30, 8); 
                if(this.item) drawWeaponGraphic(ctx, this.item, armX+30, armY);
            } else {
                ctx.fillStyle='#111'; ctx.fillRect(armX, armY, 10, 25);
                if(this.item) drawWeaponGraphic(ctx, this.item, armX, armY+20);
            }
        }
        ctx.restore();
    }
}

function drawWeaponGraphic(ctx, def, x, y) {
    ctx.fillStyle = def.color;
    if (def.type === 'melee' || def.type === 'heavy') {
        ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5); 
        ctx.fillRect(0, -5, def.w || 40, def.h || 10); 
        ctx.fillStyle='#fff'; ctx.fillRect(2, -2, 10, 4); 
        ctx.restore();
    } else if (def.type === 'gun') {
        ctx.fillRect(x, y-2, 25, 8); ctx.fillRect(x, y, 5, 12);
    } else if (def.type === 'throw') {
        ctx.beginPath(); ctx.arc(x+10, y+10, 10, 0, Math.PI*2); ctx.fill();
    } else {
        ctx.fillRect(x, y, 20, 20); ctx.strokeStyle='#fff'; ctx.strokeRect(x,y,20,20);
    }
}

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = CONFIG.WIDTH; this.canvas.height = CONFIG.HEIGHT;
        this.input = new Input();
        this.fighters = []; this.items = []; this.obstacles = []; this.particles = [];
        this.stage = STAGES[0]; this.screen = 'TITLE';
        this.cpuCount = 4;
        this.matchTime = 0;
        this.score = 0;
        this.mode = 'VERSUS';
        this.shake = 0; this.hitStop = 0;
        
        this.initMenus();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    setMode(m) {
        this.mode = m;
        // In survival, start is immediate after char select
        this.toCharSelect();
        if(m === 'SURVIVAL') {
            document.getElementById('cpu-config').style.display = 'none';
        } else {
            document.getElementById('cpu-config').style.display = 'block';
        }
    }

    addParticles(x, y, color, count=5) {
        for(let i=0; i<count; i++) this.particles.push(new Particle(x, y, color));
    }

    drawPortrait(ctx, id, c) {
        ctx.fillStyle = '#222'; ctx.fillRect(0,0,80,80);
        ctx.fillStyle = c.skin;
        if(id === 'doge') {
            ctx.fillStyle='#f1c40f'; ctx.fillRect(15,20,50,40);
            ctx.fillStyle='#000'; ctx.fillRect(25,30,5,5); ctx.fillRect(50,30,5,5);
            ctx.fillStyle='#fff'; ctx.fillRect(26,31,2,2); ctx.fillRect(51,31,2,2);
            ctx.fillStyle='#fff'; ctx.fillRect(35,45,10,5);
        } else {
            ctx.fillRect(20,15,40,45);
            ctx.fillStyle = c.hair; 
            if(id!=='bezos') { ctx.fillRect(18,10,44,10); ctx.fillRect(18,10,5,30); ctx.fillRect(57,10,5,30); }
            ctx.fillStyle = '#000';
            if(id==='zuck'){ ctx.fillRect(25,30,6,6); ctx.fillRect(49,30,6,6); }
            else if(id==='bezos') { ctx.fillStyle='#111'; ctx.fillRect(25,28,30,6); }
            else { ctx.fillRect(28,30,4,4); ctx.fillRect(48,30,4,4); }
            ctx.fillStyle = c.suit || c.shirt; ctx.fillRect(10,60,60,20);
            if(id==='elon'||id==='altman'){ ctx.fillStyle='#fff'; ctx.fillRect(35,60,10,20); ctx.fillStyle='#000'; ctx.fillRect(39,60,2,20); }
        }
    }

    initMenus() {
        const grid = document.getElementById('char-grid-lg');
        grid.innerHTML = '';
        ROSTER.forEach(char => {
            const el = document.createElement('div');
            el.className = 'char-card-lg';
            const cvs = document.createElement('canvas');
            cvs.className = 'char-canvas'; cvs.width=80; cvs.height=80;
            this.drawPortrait(cvs.getContext('2d'), char.id, char.art);
            el.appendChild(cvs);
            el.innerHTML += `<div class="char-name-lg">${char.name}</div>`;
            el.onclick = () => {
                this.p1Data = char;
                document.querySelectorAll('.char-card-lg').forEach(c => c.classList.remove('selected'));
                el.classList.add('selected');
                setTimeout(() => { this.screen='SELECT_STAGE'; this.showScreen('screen-stage-select'); }, 500);
            };
            grid.appendChild(el);
        });
        const list = document.getElementById('stage-list');
        list.innerHTML = '';
        STAGES.forEach(st => {
            const el = document.createElement('div'); el.className = 'stage-option'; el.innerText = st.name;
            el.onclick = () => { this.stage = st; this.startGame(); };
            list.appendChild(el);
        });
    }

    adjustCpu(delta) {
        this.cpuCount += delta;
        if(this.cpuCount < 2) this.cpuCount = 2; 
        if(this.cpuCount > 10) this.cpuCount = 10;
        document.getElementById('cpu-count-display').innerText = this.cpuCount;
    }

    showScreen(id) {
        document.querySelectorAll('.screen-content').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('screens').style.display = 'flex';
    }
    toCharSelect() { this.screen = 'SELECT_CHAR'; this.showScreen('screen-char-select'); }
    resetToTitle() { this.screen = 'TITLE'; this.showScreen('screen-title'); document.getElementById('hud').style.display='none'; }

    startGame() {
        if(!this.p1Data) this.p1Data = ROSTER[0];
        this.fighters = []; this.items = []; this.obstacles = []; this.particles = [];
        this.matchTime = 0; this.score = 0;
        
        let plat = CONFIG.PLATFORM;
        this.fighters.push(new Fighter(this.p1Data, plat.x + 100, 0, true));
        
        let enemies = (this.mode === 'SURVIVAL') ? 1 : (this.cpuCount - 1);
        for(let i=0; i < enemies; i++) {
            let char = ROSTER[Math.floor(Math.random()*ROSTER.length)];
            let safeX = plat.x + 50 + Math.random() * (plat.w - 100);
            this.fighters.push(new Fighter(char, safeX, i+1, false));
        }

        // Setup HUD
        const hud = document.getElementById('hud');
        hud.innerHTML = '';
        this.fighters.forEach((f, idx) => {
            let div = document.createElement('div');
            div.className = `fighter-hud ${f.isPlayer?'p1':'cpu'}`;
            div.id = `hud-${idx}`;
            div.innerHTML = `
                <div class="name-tag">${f.data.name}</div>
                <div class="stock-container">${'<div class="stock-icon"></div>'.repeat(3)}</div>
                <div class="percent-display">0%</div>
                <div class="weapon-mini">UNARMED</div>
            `;
            hud.appendChild(div);
        });

        document.getElementById('screens').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('match-info').innerText = this.mode === 'SURVIVAL' ? "KILLS: 0" : "00:00";
        this.screen = 'FIGHT';
        playSound('jump'); // Sound test
    }

    update() {
        if(this.screen !== 'FIGHT') return;
        
        // Hit Stop Logic
        if (this.hitStop > 0) {
            this.hitStop--;
            return;
        }

        this.matchTime++;
        if (this.mode !== 'SURVIVAL') {
            let s = Math.floor(this.matchTime/60);
            document.getElementById('match-info').innerText = (s<10?'0':'')+s;
        } else {
            document.getElementById('match-info').innerText = "KILLS: " + this.score;
        }

        // Items
        if (Math.random() < 0.01 && this.items.length < 5) {
            let def = ITEMS[Math.floor(Math.random()*ITEMS.length)];
            let plat = CONFIG.PLATFORM;
            let dropX = plat.x + Math.random() * plat.w;
            this.items.push(new ItemEntity(def, dropX, -50));
        }
        this.items.forEach(i => i.update());
        this.items = this.items.filter(i => i.active);

        // Particles
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);

        // Hazards
        if (Math.random() < 0.005) {
            if (this.stage.id === 'factory') this.obstacles.push(new Obstacle(CONFIG.WIDTH, CONFIG.PLATFORM.y-40, 40, 40, 'crate'));
            if (this.stage.id === 'mars') this.obstacles.push(new Obstacle(Math.random()*CONFIG.WIDTH, -50, 30, 30, 'meteor'));
            if (this.stage.id === 'meta') this.obstacles.push(new Obstacle(Math.random()*CONFIG.WIDTH, CONFIG.PLATFORM.y-60, 20, 60, 'glitch'));
        }
        this.obstacles.forEach(o => {
            if(o.type==='crate') o.vx = -2;
            if(o.type==='meteor') o.vy = 5; 
            o.update();
        });
        this.obstacles = this.obstacles.filter(o => o.active);

        // Fighters
        let aliveCount = 0;
        this.fighters.forEach((f, idx) => {
            f.update(this.input, this.fighters, this.items, this.obstacles, this);
            
            // Update HUD (Check existence for survival mode dynamic adds)
            let hud = document.getElementById(`hud-${idx}`);
            if(!hud && f.stocks > 0) { /* Lazy add for survival dynamic spawning if needed */ }
            if(hud) {
                if(f.stocks <= 0) hud.classList.add('dead');
                let pctEl = hud.querySelector('.percent-display');
                pctEl.innerText = Math.floor(f.percent) + '%';
                pctEl.style.color = f.percent >= 100 ? '#e74c3c' : (f.percent > 50 ? '#f1c40f' : '#fff');
                hud.querySelector('.stock-container').innerHTML = '<div class="stock-icon"></div>'.repeat(Math.max(0, f.stocks));
                hud.querySelector('.weapon-mini').innerText = f.item ? f.item.name : 'UNARMED';
                // Shake HUD on hit
                if (f.state === 'STUN') hud.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
                else hud.style.transform = 'translate(0,0)';
            }
            if (f.stocks > 0) aliveCount++;
        });

        // Game Over
        if (this.mode === 'VERSUS' && (this.fighters[0].stocks <= 0 || (aliveCount <= 1 && this.fighters.length > 1))) {
            this.endGame();
        } else if (this.mode === 'SURVIVAL' && this.fighters[0].stocks <= 0) {
            this.endGame();
        }
    }

    endGame() {
        this.screen = 'OVER';
        let winner = this.fighters.find(f => f.stocks > 0);
        let txt = "GAME OVER";
        if (this.mode === 'VERSUS') txt = winner ? (winner.isPlayer ? "YOU WIN" : winner.data.name + " WINS") : "DRAW";
        document.getElementById('winner-text').innerText = txt;
        if (this.mode === 'SURVIVAL') {
            document.getElementById('survival-score').style.display = 'block';
            document.getElementById('survival-score').innerText = "SCORE: " + this.score;
        } else {
            document.getElementById('survival-score').style.display = 'none';
        }
        setTimeout(() => this.showScreen('screen-gameover'), 2000);
    }

    draw() {
        const ctx = this.ctx;
        const width = CONFIG.WIDTH;
        const height = CONFIG.HEIGHT;
        const time = Date.now();

        // Base Gradient (Sky)
        let c1=this.stage.colors[0], c2=this.stage.colors[1];
        let grd = ctx.createLinearGradient(0,0,0,height);
        grd.addColorStop(0, c1); grd.addColorStop(1, c2);
        ctx.fillStyle = grd; ctx.fillRect(0,0,width, height);
        
        // Shake
        ctx.save();
        if (this.shake > 0) {
            ctx.translate(Math.random() * this.shake - this.shake/2, Math.random() * this.shake - this.shake/2);
            this.shake *= 0.9;
            if(this.shake < 0.5) this.shake = 0;
        }

        if (this.screen !== 'FIGHT' && this.screen !== 'OVER') { ctx.restore(); return; }

        // --- STAGE SPECIFIC DETAILS ---

        if(this.stage.id === 'factory') {
            // Background Pillars (Darker)
            ctx.fillStyle = '#1a1a1a';
            for(let i=0; i<width; i+=200) {
                ctx.fillRect(i, 50, 40, height);
                // Windows on pillars
                ctx.fillStyle = '#f1c40f'; // Light on
                if(Math.random()>0.95) ctx.globalAlpha = 0.5; // Flicker
                ctx.fillRect(i+10, 100, 20, 10);
                ctx.fillRect(i+10, 150, 20, 10);
                ctx.globalAlpha = 1.0;
                ctx.fillStyle = '#1a1a1a'; // Reset
            }

            // Robotic Arms (Background)
            for(let i=0; i<3; i++) {
                let armX = 150 + i * 300;
                let sway = Math.sin(time/1000 + i) * 0.5;
                ctx.save();
                ctx.translate(armX, 0);
                ctx.rotate(sway);
                ctx.fillStyle = '#555';
                ctx.fillRect(-10, 0, 20, 200); // Upper Arm
                ctx.translate(0, 200);
                ctx.rotate(sway * 1.5);
                ctx.fillStyle = '#777';
                ctx.fillRect(-8, 0, 16, 150); // Forearm
                ctx.fillStyle = '#e74c3c'; // Claw
                ctx.fillRect(-15, 150, 30, 20);
                ctx.restore();
            }

            // Floor Fog
            let gradFog = ctx.createLinearGradient(0, height-200, 0, height);
            gradFog.addColorStop(0, 'rgba(255,255,255,0)');
            gradFog.addColorStop(1, 'rgba(200,200,200,0.2)');
            ctx.fillStyle = gradFog;
            ctx.fillRect(0, height-200, width, 200);

        } else if (this.stage.id === 'mars') {
            // Stars (Static + Twinkle)
            ctx.fillStyle = '#fff'; 
            for(let i=0;i<80;i++) {
                let a = Math.random();
                if (Math.random() > 0.98) a = 0; // Twinkle
                ctx.globalAlpha = a;
                ctx.fillRect(((i*137)%width), ((i*67)%400), Math.random()*2+1, Math.random()*2+1);
            }
            ctx.globalAlpha = 1.0;

            // Earth in the sky
            ctx.fillStyle = '#3498db'; 
            ctx.beginPath(); ctx.arc(width - 100, 100, 30, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#2ecc71'; // Continents (Abstract)
            ctx.beginPath(); ctx.arc(width - 110, 90, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(width - 90, 110, 8, 0, Math.PI*2); ctx.fill();

            // Parallax Mountains (Far)
            ctx.fillStyle = '#4e342e';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                // Parallax shift based on player 1 position if possible, else 0
                let shift = (this.fighters[0]) ? this.fighters[0].x * 0.005 : 0;
                ctx.lineTo(i, height - 150 - Math.sin(i*0.01 + shift)*50);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Parallax Dunes (Near)
            ctx.fillStyle = '#b7410e';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                let shift = (this.fighters[0]) ? this.fighters[0].x * 0.01 : 0;
                ctx.lineTo(i, height - 50 - Math.sin(i*0.02 + shift)*30);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Rover (Background Layer)
            let roverX = (time / 5) % (width + 200) - 100;
            // Draw Cybertruck-ish rover
            ctx.fillStyle = '#95a5a6';
            ctx.beginPath();
            ctx.moveTo(roverX, height-60);
            ctx.lineTo(roverX+20, height-80); // Hood
            ctx.lineTo(roverX+50, height-90); // Roof peak
            ctx.lineTo(roverX+100, height-60); // Back
            ctx.closePath();
            ctx.fill();
            // Wheels
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(roverX+20, height-60, 12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(roverX+80, height-60, 12, 0, Math.PI*2); ctx.fill();

        } else if (this.stage.id === 'meta') {
            // Perspective Grid
            ctx.strokeStyle = '#d600ff'; 
            ctx.lineWidth = 2;
            ctx.beginPath();
            let horizon = height * 0.4;
            // Vertical lines converging
            for(let i=-width; i<width*2; i+=100) {
                let x = i - ((this.fighters[0] ? this.fighters[0].x : 0) * 0.2); // Parallax slide
                ctx.moveTo(x, height);
                ctx.lineTo(width/2 + (x-width/2)*0.1, horizon);
            }
            // Horizontal lines
            for(let i=height; i>horizon; i-=40) {
                ctx.moveTo(0, i);
                ctx.lineTo(width, i);
            }
            ctx.stroke();

            // Digital Rain
            ctx.font = '12px monospace';
            ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
            for(let i=0; i<40; i++) {
                let char = String.fromCharCode(0x30A0 + Math.random() * 96); // Katakana
                let rx = (i * 50) % width;
                let ry = (time/2 + i*100) % height;
                ctx.fillText(char, rx, ry);
            }

            // Floating Geometric Shapes
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            let shapeY = height/2 + Math.sin(time/500)*50;
            ctx.strokeRect(width*0.2, shapeY, 60, 60);
            ctx.beginPath(); ctx.arc(width*0.8, shapeY+50, 40, 0, Math.PI*2); ctx.stroke();
        }

        // Draw Platform
        ctx.fillStyle = '#333'; ctx.fillRect(CONFIG.PLATFORM.x, CONFIG.PLATFORM.y, CONFIG.PLATFORM.w, CONFIG.PLATFORM.h);
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(CONFIG.PLATFORM.x, CONFIG.PLATFORM.y, CONFIG.PLATFORM.w, 4);

        this.obstacles.forEach(o => o.draw(ctx));
        this.particles.forEach(p => p.draw(ctx));
        this.items.forEach(i => i.draw(ctx));
        [...this.fighters].sort((a,b) => a.y - b.y).forEach(f => f.draw(ctx));
        
        ctx.restore();
    }

    loop() { this.update(); this.draw(); requestAnimationFrame(this.loop); }
}

window.onload = () => { game = new Game(); };
</script>
