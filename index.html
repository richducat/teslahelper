  <!-- Structured data: example HowTo + FAQPage -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HowTo",
      "name": "Enable Sentry Mode on a 2025 Model Y",
      "description": "Quick steps to enable and customize Sentry Mode. Updated for software 2025.38.",
      "totalTime": "PT2M",
      "tool": [{ "@type": "HowToTool", "name": "Tesla touchscreen" }],
      "step": [
        { "@type": "HowToStep", "name": "Open Controls", "text": "Tap Controls > Safety." },
        { "@type": "HowToStep", "name": "Enable Sentry Mode", "text": "Toggle Sentry Mode on." },
        {
          "@type": "HowToStep",
          "name": "Customize",
          "text": "Set exclusions for Home, Work, or Favorites and confirm recording is allowed in your region."
        }
      ],
      "isBasedOn": [
        "https://www.tesla.com/ownersmanual/modely/en_us/",
        "https://www.tesla.com/support/feature-tutorials/sentry-mode"
      ]
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Tesla Helper affiliated with Tesla?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Tesla Helper is an independent guide that links to official Tesla resources."
          }
        },
        {
          "@type": "Question",
          "name": "Can I install Tesla Helper as an app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Add Tesla Helper to your Home Screen to use it offline; the site includes a manifest and service worker."
          }
        }
      ]
    }
  </script>

  <script src="config/runtime-env.js"></script>
  <script>
    const runtimeEnv = window.APP_ENV || {};
    const defaultEnv = {
      plausibleDomain: 'teslahelper.app',
      metaPixelId: 'xxxxxxxxxxxxxxx',
      googleAdsId: 'AW-XXXXXXXXX',
      beehiivEmbedId: 'bhv_XXXXXXXX',
      adsenseSlotId: '1234567890',

    const defaultTeslaAuth = {

      apiBase: 'https://fleet-api.prd.na.vn.cloud.tesla.com',

      tokenEndpoint: 'https://fleet-auth.prd.na.vn.cloud.tesla.com/oauth2/v3/token',
    };

    window.APP_ENV = { ...defaultEnv, ...runtimeEnv };
    window.APP_ENV.teslaAuth = { ...defaultTeslaAuth, ...(runtimeEnv.teslaAuth || {}) };
  </script>
