<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elon Highway Run</title>
  <meta name="description" content="Dodge critics and collect energy in this tongue-in-cheek highway runner starring Elon Musk." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #05060c;
      --road: #0f111a;
      --lane: #171a26;
      --accent: #e6398e;
      --good: #32d399;
      --warn: #f3b83b;
      --text: #f5f7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, rgba(230,57,142,0.16), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(50,211,153,0.16), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      gap: 16px;
    }
    header { text-align: center; max-width: 860px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 38px); letter-spacing: -0.02em; }
    p.lede { margin: 0; opacity: 0.86; }
    .card {
      width: min(980px, 100%);
      background: rgba(15, 17, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      overflow: hidden;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.38);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
    }
    .hud .metric {
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }
    canvas { width: 100%; display: block; background: var(--road); }
    .controls {
      padding: 14px 16px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      font-size: 14px;
    }
    .pill {
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    button.play {
      background: linear-gradient(135deg, #e6398e, #4c6fff);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(76, 111, 255, 0.35);
    }
    button.play:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <header>
    <h1>Elon Highway Run</h1>
    <p class="lede">A playful clone of Footy Run 3D, but this time you're a giant Elon head riding a Tesla Roadster down a neon highway. Dodge critics, collect batteries, signed contracts, and bags of money.</p>
  </header>

  <div class="card">
    <div class="hud" id="hud">
      <div class="metric"><strong>Score</strong><div id="score">0</div></div>
      <div class="metric"><strong>Distance</strong><div id="distance">0 m</div></div>
      <div class="metric"><strong>Streak</strong><div id="streak">x1</div></div>
      <div class="metric"><strong>Lives</strong><div id="lives">3</div></div>
    </div>
    <canvas id="game" width="960" height="540" aria-label="Elon Highway Runner game"></canvas>
    <div class="controls">
      <span class="pill">⬅️/➡️ Move lanes</span>
      <span class="pill">⏩ Collect green, dodge pink</span>
      <button class="play" id="playBtn">Start / Restart</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hud = {
      score: document.getElementById('score'),
      distance: document.getElementById('distance'),
      streak: document.getElementById('streak'),
      lives: document.getElementById('lives'),
    };

    const lanes = 3;
    let laneWidth = canvas.width / lanes;
    const player = { lane: 1, y: canvas.height - 120, size: 64, tint: '#e6398e' };
    const obstacles = [];
    const pickups = [];
    let running = false;
    let score = 0;
    let distance = 0;
    let streak = 1;
    let lives = 3;
    let lastSpawn = 0;
    let lastGood = 0;
    let lastTime = 0;

    function resize() {
      const ratio = 16 / 9;
      const w = Math.min(1100, window.innerWidth - 32);
      const h = w / ratio;
      canvas.width = w;
      canvas.height = h;
      laneWidth = canvas.width / lanes;
      player.y = canvas.height - 120;
    }
    resize();
    window.addEventListener('resize', resize);

    function laneX(lane) {
      return lane * laneWidth + laneWidth / 2;
    }

    function drawRoad() {
      ctx.fillStyle = 'linear';
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#0c0f1a');
      gradient.addColorStop(1, '#0b0d15');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 1; i < lanes; i++) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(i * laneWidth - 2, 0, 4, canvas.height);
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 4;
      const dash = 32, gap = 22;
      let y = (Date.now() / 6) % (dash + gap);
      while (y < canvas.height) {
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, y);
        ctx.lineTo(canvas.width / 2, y + dash);
        ctx.stroke();
        y += dash + gap;
      }
    }

    function drawPlayer() {
      const x = laneX(player.lane);
      const y = player.y;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#1a1e2c';
      ctx.strokeStyle = player.tint;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(-44, -26, 88, 52, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#121521';
      ctx.beginPath();
      ctx.roundRect(-30, -18, 60, 36, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.stroke();

      ctx.fillStyle = '#f7b500';
      ctx.font = 'bold 16px Inter';
      ctx.textAlign = 'center';
      ctx.fillText('TESLA', 0, 6);

      ctx.fillStyle = '#ffe6f3';
      ctx.beginPath();
      ctx.arc(0, -30, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = player.tint;
      ctx.stroke();

      ctx.fillStyle = '#0f111a';
      ctx.font = 'bold 14px Inter';
      ctx.fillText('ELON', 0, -26);
      ctx.restore();
    }

    function spawnOpponent() {
      const lane = Math.floor(Math.random() * lanes);
      const tags = ['Politician', 'Legacy OEM', 'Short Seller', 'Old Media'];
      obstacles.push({
        lane,
        y: -80,
        speed: 220 + Math.random() * 60,
        label: tags[Math.floor(Math.random() * tags.length)],
        hue: '#e6398e',
        size: 70,
      });
    }

    function spawnPickup() {
      const lane = Math.floor(Math.random() * lanes);
      const types = [
        { label: '🔋 Battery', color: '#32d399', points: 120 },
        { label: '✅ Contract', color: '#5dd3ff', points: 160 },
        { label: '💰 Money', color: '#f3b83b', points: 200 },
      ];
      const pick = types[Math.floor(Math.random() * types.length)];
      pickups.push({ lane, y: -60, speed: 200 + Math.random() * 40, ...pick, size: 54 });
    }

    function drawOpponent(o) {
      const x = laneX(o.lane);
      ctx.save();
      ctx.translate(x, o.y);
      ctx.fillStyle = 'rgba(230,57,142,0.16)';
      ctx.beginPath();
      ctx.arc(0, 0, o.size / 2 + 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1a0f17';
      ctx.strokeStyle = o.hue;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(-o.size / 2, -o.size / 2, o.size, o.size, 18);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffe9f4';
      ctx.font = 'bold 13px Inter';
      ctx.textAlign = 'center';
      ctx.fillText(o.label, 0, 6);
      ctx.restore();
    }

    function drawPickup(p) {
      const x = laneX(p.lane);
      ctx.save();
      ctx.translate(x, p.y);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2 + 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = p.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-p.size / 2, -p.size / 2, p.size, p.size, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0b0d15';
      ctx.font = 'bold 12px Inter';
      ctx.textAlign = 'center';
      ctx.fillText(p.label, 0, 4);
      ctx.restore();
    }

    function moveLane(dir) {
      if (!running) return;
      player.lane = Math.max(0, Math.min(lanes - 1, player.lane + dir));
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') moveLane(-1);
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') moveLane(1);
      if (e.key === ' ' && !running) startGame();
    });

    document.getElementById('playBtn').addEventListener('click', startGame);

    function reset() {
      obstacles.length = 0;
      pickups.length = 0;
      score = 0;
      distance = 0;
      streak = 1;
      lives = 3;
      lastSpawn = 0;
      lastGood = 0;
      lastTime = 0;
      player.lane = 1;
      updateHud();
    }

    function startGame() {
      reset();
      running = true;
      window.requestAnimationFrame(loop);
    }

    function collide(a, b, hitbox = 42) {
      return Math.abs(laneX(a.lane) - laneX(b.lane)) < laneWidth * 0.45 && Math.abs((a.y || a.yPos) - (b.y || b.yPos)) < hitbox;
    }

    function updateHud() {
      hud.score.textContent = Math.round(score);
      hud.distance.textContent = `${Math.round(distance)} m`;
      hud.streak.textContent = `x${streak}`;
      hud.lives.textContent = lives;
    }

    function loop(timestamp) {
      if (!running) return;
      if (!lastTime) lastTime = timestamp;
      const delta = Math.min(32, timestamp - lastTime) / 1000;
      lastTime = timestamp;

      distance += 120 * delta;
      lastSpawn += delta;
      lastGood += delta;

      if (lastSpawn > 0.9) { spawnOpponent(); lastSpawn = 0; }
      if (lastGood > 0.7) { spawnPickup(); lastGood = 0; }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawRoad();
      drawPlayer();

      for (const o of obstacles) {
        o.y += o.speed * delta;
        drawOpponent(o);
      }
      for (const p of pickups) {
        p.y += p.speed * delta;
        drawPickup(p);
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        if (collide(player, o, 56)) {
          obstacles.splice(i, 1);
          streak = 1;
          lives -= 1;
          player.tint = '#ff5c8a';
          setTimeout(() => (player.tint = '#e6398e'), 150);
          if (lives <= 0) {
            running = false;
            drawGameOver();
            updateHud();
            return;
          }
        }
        if (o.y > canvas.height + 100) obstacles.splice(i, 1);
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        if (collide(player, p, 52)) {
          pickups.splice(i, 1);
          score += p.points * streak;
          streak = Math.min(streak + 1, 9);
        }
        if (p.y > canvas.height + 80) pickups.splice(i, 1);
      }

      updateHud();
      window.requestAnimationFrame(loop);
    }

    function drawGameOver() {
      ctx.save();
      ctx.fillStyle = 'rgba(5,6,12,0.72)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 42px Inter';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '20px Inter';
      ctx.fillText('Click Start / Restart or press Space to race again.', canvas.width / 2, canvas.height / 2 + 30);
      ctx.restore();
    }

    drawRoad();
    drawPlayer();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '20px Inter';
    ctx.textAlign = 'center';
    ctx.fillText('Tap Start to drive the Roadster. Avoid critics. Collect the good stuff.', canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
