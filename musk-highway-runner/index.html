<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elon Highway Runner</title>
  <meta name="description" content="Always load the latest version of the Elon Highway Runner game.">
  <meta http-equiv="Cache-Control" content="no-store">
  <style>
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05060c;
      color: #f5f7ff;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: rgba(15, 17, 26, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 12px; letter-spacing: -0.01em; }
    p { margin: 0 0 16px; opacity: 0.85; }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e6398e, #4c6fff);
      color: white;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(76, 111, 255, 0.35);
    }
  </style>
  <script>
    (() => {
      const latestUrl = 'https://teslahelper.app/musk-highway-runner/';
      const isAlreadyAtLatest = window.location.href.replace(/#.*$/, '') === latestUrl;
      if (!isAlreadyAtLatest) {
        window.location.replace(latestUrl);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Loading the latest Elon Highway Runner…</h1>
    <p>If you are not redirected automatically, you can open the most recent version of the game below.</p>
    <a class="button" href="https://teslahelper.app/musk-highway-runner/">Play the latest version</a>
  </div>
</body>
</html>
